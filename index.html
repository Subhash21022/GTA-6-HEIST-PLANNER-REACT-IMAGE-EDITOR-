<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Heist Planner</title>
    <meta name="description" content="Plan a heist in Vice City. Draw infiltration routes, assemble a crew, and export a mission briefing. Built with React Image Editor." />
    <!-- Preload Authentic GTA Fonts -->
    <link rel="preload" href="/fonts/pricedown.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/ChaletLondonNineteenSixty.woff" as="font" type="font/woff" crossorigin />
    <link rel="preload" href="/fonts/ChaletNewYorkNineteenSixty.woff" as="font" type="font/woff" crossorigin />
    <script>
      // Automatically purge any cached service workers left over by other projects on localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
